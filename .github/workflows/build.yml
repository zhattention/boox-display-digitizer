name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-server:
    strategy:
      matrix:
        include:
          - arch: arm64
            python-arch: arm64
          - arch: x86_64
            python-arch: x64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python-arch }}

      - name: Verify architecture
        run: |
          python -c "import platform; print('Python arch:', platform.machine())"
          file $(which python)

      - name: Install dependencies
        run: |
          cd server
          pip install -r requirements.txt py2app

      - name: Build .app bundle with py2app
        run: |
          cd server
          python setup.py py2app

      - name: Code sign (ad-hoc)
        run: |
          codesign --deep --force --sign - "server/dist/Boox Display Digitizer.app"

      - name: Verify binary architecture
        run: |
          file "server/dist/Boox Display Digitizer.app/Contents/MacOS/Boox Display Digitizer"

      - name: Create DMG
        run: |
          cd server
          mkdir -p dmg-stage
          cp -R "dist/Boox Display Digitizer.app" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          sync && sleep 1
          hdiutil create \
            -volname "Boox Display Digitizer" \
            -srcfolder dmg-stage \
            -ov -format UDZO \
            "dist/BooxDisplayDigitizer-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.arch }}
          path: server/dist/BooxDisplayDigitizer-${{ matrix.arch }}.dmg

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/BooxDisplayDigitizer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/BooxDisplayDigitizer.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-server, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/server-arm64/*.dmg
            artifacts/server-x86_64/*.dmg
            artifacts/android-apk/*.apk
          generate_release_notes: true
